---
name: 'Build LaTeX Document with Biber'
on:
  push:
    branches:
      - trunk

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      UV_CACHE_DIR: /tmp/.uv-cache

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - uses: actions/cache@v4
        name: Tectonic Cache
        with:
          path: ~/.cache/Tectonic
          key: ${{ runner.os }}-tectonic-${{ hashFiles('**/*.tex') }}
          restore-keys: |
           ${{ runner.os }}-tectonic-
      - uses: wtfjoke/setup-tectonic@v3
        name: Setup Tectonic
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          biber-version: '2.17'

      - name: Install julia pygments
        run: |
          python -m pip install --upgrade git+https://github.com/sisl/pygments-julia#egg=pygments_julia
          python -m pip install Pygments
      # - name: Setup Uv
      #   uses: astral-sh/setup-uv@v6
      #   with:
      #     enable-cache: true
      # - name: Install pygments-julia and pygments
      #   run: | 
      #     # uv venv
      #     pipx install Pygments
      #     pipx install git+https://github.com/sisl/pygments-julia#egg=pygments_julia 
      #     # echo .venv/bin >> "$GITHUB_PATH"

      - name: Install JuliaMono Font
        run: |
          wget -O JuliaMono-ttf.zip https://github.com/cormullion/juliamono/releases/latest/download/JuliaMono-ttf.zip
          unzip -d julia_mono/ JuliaMono-ttf.zip
          mv julia_mono /usr/share/fonts/
          fc-cache -fv

      - name: Build document
        run: |
          mkdir shell-escape
          tectonic -X build

      - name: Upload pdf
        uses: actions/upload-artifact@v4
        with:
          name: BP_Slides
          path: build/DL_intro_slides/DL_intro_slides.pdf
